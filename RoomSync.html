<style>
/* Layout: sticky top bar, tab row, then a two-column work area (search + results | live floor maps). Maps are the hero. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --fg:#16202a; --muted:#566471; --line:#d3dbe1; --accent:#1d4fd7; --accent-fg:#ffffff;
  --free:#16794a; --free-bg:#e2f4ea; --busy:#b3261e; --busy-bg:#fbe6e3; --warn:#9a6700; --warn-bg:#fdf0d2; --off-bg:#e6eaed; --soft:#e4eaf6;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#18222b; --fg:#e6ecf1; --muted:#97a6b3; --line:#2b3947; --accent:#7ca2ff; --accent-fg:#0b1220;
  --free:#59d18d; --free-bg:#12301f; --busy:#ff8b80; --busy-bg:#3a1916; --warn:#f0c060; --warn-bg:#352a0e; --off-bg:#1f2a34; --soft:#1b2a4a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#18222b; --fg:#e6ecf1; --muted:#97a6b3; --line:#2b3947; --accent:#7ca2ff; --accent-fg:#0b1220;
  --free:#59d18d; --free-bg:#12301f; --busy:#ff8b80; --busy-bg:#3a1916; --warn:#f0c060; --warn-bg:#352a0e; --off-bg:#1f2a34; --soft:#1b2a4a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{max-width:1280px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:14px 0 10px}

.chip.ok{background:var(--free-bg);border-color:var(--free);color:var(--free)}
.chip.bad{background:var(--busy-bg);border-color:var(--busy);color:var(--busy)}

select,input[type=text],input[type=date],textarea,input[type=number]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);min-height:34px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nl{display:flex;gap:6px}
.nl input{flex:1;min-width:0}

.item{border:1px solid var(--line);border-radius:5px;padding:9px 10px;display:grid;gap:4px;background:var(--surface)}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item .hd{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}

.room.free rect{fill:var(--free-bg);stroke:var(--free)}

.room:focus-visible rect{stroke:var(--accent);stroke-width:3}
.stair rect{fill:none;stroke:var(--line);stroke-width:1}
.stair line{stroke:var(--line)}
.tl{position:relative;height:34px;background:var(--off-bg);border-radius:4px;margin:8px 0 2px}
.tl .blk{position:absolute;top:3px;bottom:3px;background:var(--busy-bg);border:1px solid var(--busy);border-radius:3px;overflow:hidden;font-size:11px;padding:2px 4px;white-space:nowrap;text-overflow:ellipsis}
.tl .win{position:absolute;top:0;bottom:0;border:2px dashed var(--accent);border-radius:3px;background:var(--soft);opacity:.7}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--mono)}
.day{margin-bottom:18px}
.day h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.card{border:1px solid var(--line);border-radius:5px;background:var(--surface);padding:10px 12px;display:grid;gap:6px;margin-bottom:8px}
.card.cancelled{opacity:.75}
.card.cancelled .t{text-decoration:line-through}
.card .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.card .t{font-weight:600}
.card .tm{font-family:var(--mono);font-size:13px}
.card .meta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.card .act{display:flex;gap:6px;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--accent);font-size:12.5px}
details ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
.notice.sup{opacity:.6}
.notice p{margin:2px 0 6px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
.tw{overflow-x:auto}
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:100%;max-width:560px;padding:16px;margin-top:4vh}
.modal h2{font-size:17px;margin-bottom:12px}
.msg{border-radius:5px;padding:9px 11px;border:1px solid;font-size:13px}
.msg.bad{background:var(--busy-bg);border-color:var(--busy)}
.msg.good{background:var(--free-bg);border-color:var(--free)}
.msg.warn{background:var(--warn-bg);border-color:var(--warn)}
.msg ul{margin:4px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
.toast.on{opacity:1}
.hint{font-size:12px;color:var(--muted)}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.grid3{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<div class="app">
  <header class="top">
    <div class="brand"><h1>RoomSync</h1><span>IET and Deeksha Bhawan, DDUGU</span><span class="chip test">TEST DATA</span></div>
    <div class="who" id="who"></div>
  </header>
  <nav id="nav" aria-label="Sections"></nav>
  <main id="view"></main>
</div>
<div id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// ===== LOGIC (no DOM) =====
const NOW = '2026-11-05';
const OPEN = 540, CLOSE = 1020, BUFFER = 10;
const DAYN = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad = n => String(n).padStart(2, '0');
const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const fmt = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dow = iso => new Date(iso + 'T00:00:00Z').getUTCDay();
const dlabel = iso => { const d = new Date(iso + 'T00:00:00Z'); return DAYN[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MON[d.getUTCMonth()]; };
const weekStart = iso => { const w = dow(iso); return addDays(iso, w === 0 ? -6 : 1 - w); };
const ov = (s1, e1, s2, e2) => s1 < e2 && e1 > s2;

const BUILD = { IET: 'IET', DB: 'Deeksha Bhawan' };
const TYPENAME = { class: 'classroom', lab: 'laboratory', hall: 'seminar hall', library: 'library', office: 'office' };
const TL = { timetable: 'Regular class', extra: 'Extra class', exam: 'Minor exam', practical: 'Practical', event: 'Event' };
const USE = { extra: ['class', 'hall'], exam: ['class', 'hall', 'library'], practical: ['lab'], event: ['class', 'hall', 'library'], timetable: ['class', 'hall', 'lab'] };

// ---- Rooms (from the blueprints and the problem text) ----
const R = [];
function room(id, b, floor, name, type, cap, o) { R.push(Object.assign({ id, b, floor, name, type, cap, bookable: true, tbc: false, out: false, outReason: '' }, o || {})); }
room('IET-LIB', 'IET', 0, 'Library', 'library', 180, { note: 'Approx. 150-180 seats; used for exams' });
room('IET-TO', 'IET', 0, "Teachers' office", 'office', 0, { bookable: false });
room('IET-PC', 'IET', 0, 'Placement Cell', 'office', 0, { bookable: false });
room('IET-DIR', 'IET', 0, "Director's office", 'office', 0, { bookable: false });
['IET22', 'IET16', 'IET14', 'IET15'].forEach(id => room(id, 'IET', 1, id, 'lab', 40, { tbc: true, note: 'Lab (department and capacity to be confirmed)' }));
['IET20', 'IET19', 'IET18', 'IET17'].forEach(id => room(id, 'IET', 1, id, 'class', 75));
room('IET32', 'IET', 2, 'IET32 Seminar Hall', 'hall', 200);
['IET24', 'IET25', 'IET30', 'IET29', 'IET28'].forEach(id => room(id, 'IET', 2, id, 'class', 75));
room('IET23', 'IET', 2, 'IET23', 'class', 75, { tbc: true, note: 'On the blueprint, not in the text' });
for (let i = 1; i <= 14; i++) {
  const id = 'LH' + pad(i);
  room(id, 'DB', i <= 7 ? 0 : 1, id, 'class', [1, 2, 8, 9].includes(i) ? 90 : 60, { tbc: true, note: i > 12 ? 'On the blueprint only (text lists LH01-LH12)' : 'Capacity to be confirmed' });
}
const roomById = id => R.find(r => r.id === id);
const roomLabel = r => (r.floor === 0 ? 'Ground' : r.floor === 1 ? 'First' : 'Second') + ' floor';

// ---- Students / branches ----
const BRANCHES = [
  { k: 'CSE', n: 'CSE', secs: ['A', 'B'] }, { k: 'AIML', n: 'AI ML', secs: ['A', 'B'] },
  { k: 'AIDS', n: 'AI DS', secs: ['All'] }, { k: 'ECE', n: 'ECE', secs: ['All'] },
  { k: 'ME', n: 'ME', secs: ['All'] }, { k: 'IT', n: 'IT', secs: ['All'] }
];
const bname = k => (BRANCHES.find(b => b.k === k) || { n: 'All branches' }).n;
const GROUPS = [];
BRANCHES.forEach(b => [1, 2, 3, 4].forEach(y => b.secs.forEach(s => GROUPS.push({ branch: b.k, year: y, section: s, size: 75, key: b.k + '-' + y + '-' + s }))));
const groupLabel = g => bname(g.branch) + ' Year ' + g.year + (g.section !== 'All' ? ' Sec ' + g.section : '');
const audLabel = a => a.branch === 'ALL' ? 'All students' : bname(a.branch) + (a.year ? ' Year ' + a.year : ' all years') + (a.section && a.section !== 'All' ? ' Sec ' + a.section : '');
const secOk = (a, b) => a === 'All' || b === 'All' || a === b || !a || !b;
const matchAud = (a, g) => (a.branch === 'ALL' || a.branch === g.branch) && (!a.year || a.year === g.year) && secOk(a.section, g.section);
const audOverlap = (a, b) => !!a && !!b && (a.branch === 'ALL' || b.branch === 'ALL' || a.branch === b.branch) && (!a.year || !b.year || a.year === b.year) && secOk(a.section, b.section);
const audSize = a => GROUPS.filter(g => matchAud(a, g)).reduce((s, g) => s + g.size, 0);

const FAC = [
  { id: 'F1', name: 'Dr. R. Verma' }, { id: 'F2', name: 'Prof. S. Mishra' }, { id: 'F3', name: 'Dr. A. Singh' },
  { id: 'F4', name: 'Prof. N. Gupta' }, { id: 'F5', name: 'Dr. P. Tiwari' }, { id: 'F6', name: 'Prof. K. Yadav' },
  { id: 'F7', name: 'Dr. M. Pandey' }, { id: 'F8', name: 'Prof. D. Shukla' }, { id: 'ADMIN', name: 'Exam Cell' }
];
const facName = id => (FAC.find(f => f.id === id) || { name: '-' }).name;

// ---- Store ----
const S = { bookings: [], notices: [], audit: [], seq: 1000, nseq: 0 };
const stamp = () => new Date().toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
function fnv(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); }
function audit(actor, action, text, bid) {
  const prev = S.audit.length ? S.audit[S.audit.length - 1].hash : '00000000';
  const ts = stamp();
  S.audit.push({ n: S.audit.length + 1, ts, actor, action, text, bid: bid || '', hash: fnv(prev + '|' + ts + '|' + actor + '|' + action + '|' + text) });
}
function verifyChain() {
  let prev = '00000000';
  for (const e of S.audit) { if (fnv(prev + '|' + e.ts + '|' + e.actor + '|' + e.action + '|' + e.text) !== e.hash) return { ok: false, at: e.n }; prev = e.hash; }
  return { ok: true, n: S.audit.length };
}

// ---- Conflict engine ----
const needsApproval = (b, who) => who.role !== 'admin' && (roomById(b.roomId).type === 'library' || (b.type === 'event' && roomById(b.roomId).type === 'hall'));
const can = (who, act, b) => who.role === 'admin' ? true : who.role === 'faculty' ? (act === 'create' || (!!b && b.facId === who.id && b.type !== 'timetable')) : (who.role === 'student' && act === 'report');
const live = (date, ignore) => S.bookings.filter(x => x.id !== ignore && x.status !== 'cancelled' && x.date === date);

function check(b, ignore) {
  const res = { errors: [], warns: [], clash: { room: [], aud: [], fac: [] } };
  const rm = roomById(b.roomId);
  if (!rm) { res.errors.push('Pick a room.'); return res; }
  if (!rm.bookable) res.errors.push(rm.name + ' is not a bookable space.');
  if (rm.out) res.errors.push(rm.name + ' is marked unavailable' + (rm.outReason ? ' (' + rm.outReason + ')' : '') + '.');
  if (b.end <= b.start) res.errors.push('End time must be after start time.');
  if (b.start < OPEN || b.end > CLOSE) res.errors.push('Bookings run from 09:00 to 17:00.');
  if (rm.bookable && !USE[b.type].includes(rm.type)) res.errors.push(TL[b.type] + ' cannot be held in a ' + TYPENAME[rm.type] + ' (allowed: ' + USE[b.type].map(t => TYPENAME[t]).join(', ') + ').');
  if (rm.bookable && b.need > rm.cap) res.errors.push('Needs ' + b.need + ' seats but ' + rm.name + ' has ' + rm.cap + '.');
  else if (rm.bookable && b.need / rm.cap > 0.95) res.warns.push({ kind: 'full', text: 'Room will be completely full (' + b.need + ' of ' + rm.cap + ').' });
  for (const x of live(b.date, ignore)) {
    const xr = roomById(x.roomId), o = ov(b.start, b.end, x.start, x.end);
    const when = fmt(x.start) + '-' + fmt(x.end);
    if (o && x.roomId === b.roomId) { res.clash.room.push(x); res.errors.push('Room already booked: "' + x.title + '" (' + when + ').'); }
    if (o && audOverlap(x.aud, b.aud)) { res.clash.aud.push(x); res.errors.push(audLabel(b.aud) + ' already has "' + x.title + '" at ' + when + ' in ' + xr.name + '.'); }
    if (o && b.facId && x.facId === b.facId && b.facId !== 'ADMIN') { res.clash.fac.push(x); res.errors.push(facName(b.facId) + ' is already teaching "' + x.title + '" at ' + when + '.'); }
    if (!o && rm.b !== xr.b && audOverlap(x.aud, b.aud)) {
      const gap = x.end <= b.start ? b.start - x.end : x.start >= b.end ? x.start - b.end : 999;
      if (gap < BUFFER) res.warns.push({ kind: 'buffer', text: 'Only ' + gap + ' min to walk between ' + BUILD[xr.b] + ' and ' + BUILD[rm.b] + ' (about 100 m). "' + x.title + '" is ' + (x.end <= b.start ? 'just before' : 'just after') + '.' });
    }
  }
  return res;
}
function roomOnlyOk(b, rm) {
  return rm.bookable && !rm.out && USE[b.type].includes(rm.type) && b.need <= rm.cap &&
    !live(b.date, b.ignore).some(x => x.roomId === rm.id && ov(b.start, b.end, x.start, x.end));
}
// Ranked free rooms. Scores are explainable, every candidate is validated against live bookings.
function alternatives(b, prefId, who) {
  const pref = prefId ? roomById(prefId) : null, out = [];
  for (const rm of R) {
    if (!roomOnlyOk(b, rm)) continue;
    let sc = 100; const why = [];
    const head = (rm.cap - b.need) / rm.cap;
    sc -= head * 40;
    if (head < 0.05) { sc -= 8; why.push('full to capacity'); } else if (head <= 0.35) why.push('seats ' + rm.cap + ' for ' + b.need); else why.push('seats ' + rm.cap + ', larger than needed');
    if ((rm.type === 'hall' || rm.type === 'library') && b.need < 100) { sc -= 25; why.push('large venue, keep for big groups'); }
    if (pref) {
      if (rm.b === pref.b) { sc += 15; if (rm.floor === pref.floor) { sc += 10; why.push('same floor'); } else why.push('same building'); }
      else { sc -= 5; why.push(BUILD[rm.b] + ', about 100 m away'); }
    }
    if (b.aud) {
      const c = check(Object.assign({}, b, { roomId: rm.id }), b.ignore);
      if (c.warns.some(w => w.kind === 'buffer')) { sc -= 20; why.push('tight walk between buildings'); }
    }
    if (who && needsApproval({ roomId: rm.id, type: b.type }, who)) { sc -= 5; why.push('needs admin approval'); }
    if (rm.tbc) { sc -= 2; why.push('capacity unconfirmed'); }

  for (let st = OPEN; st + dur <= CLOSE; st += 30) {

    const alt = alternatives(t, b.roomId, who)[0];
    if (!alt) continue;
    const c = check(Object.assign({}, t, { roomId: alt.room.id }), b.ignore);
    if (c.clash.aud.length || c.clash.fac.length) continue;

// ---- Natural-language search (rule-based demo; the full build sends this to an LLM that calls the same search) ----
function parseNL(t) {
  const s = t.toLowerCase(), o = {};
  let m = s.match(/(\d{1,3})\s*(students|seats|people|persons|pax|capacity)/) || s.match(/\bfor\s+(\d{1,3})\b(?!\s*(am|pm|:|hour|hr|h\b|min))/);
  if (m) o.need = Number(m[1]);
  m = s.match(/(\d+(?:\.\d+)?)\s*(hours?|hrs?|h)\b/);
  if (m) o.dur = Math.round(parseFloat(m[1]) * 60);
  else if ((m = s.match(/(\d+)\s*(minutes?|mins?)/))) o.dur = Number(m[1]);
  m = s.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/);
  if (m) { let h = Number(m[1]) % 12; if (m[3] === 'pm') h += 12; o.start = pad(h) + ':' + (m[2] || '00'); }
  else if ((m = s.match(/\bat\s+(\d{1,2}):(\d{2})/))) o.start = pad(Number(m[1])) + ':' + m[2];
  else if (/after lunch|afternoon/.test(s)) o.start = '14:00';
  else if (/morning/.test(s)) o.start = '09:00';
  else if (/noon|midday/.test(s)) o.start = '12:00';
  if (/tomorrow/.test(s)) o.date = addDays(NOW, 1);
  else if (/today/.test(s)) o.date = NOW;
  else if ((m = s.match(/(\d{4}-\d{2}-\d{2})/))) o.date = m[1];
  else {
    const names = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
    const i = names.findIndex(n => s.includes(n) || s.includes(n.slice(0, 3) + ' ') || s.endsWith(n.slice(0, 3)));
    if (i >= 0) { let d = 1; while (dow(addDays(NOW, d)) !== i) d++; o.date = addDays(NOW, d); }
  }
  if (/deeksha|\blh\d*/.test(s)) o.b = 'DB'; else if (/\biet\b/.test(s)) o.b = 'IET';
  if (/\blab\b|practical/.test(s)) { o.type = 'lab'; o.purpose = 'practical'; }
  else if (/seminar|\bhall\b/.test(s)) o.type = 'hall';
  else if (/library/.test(s)) o.type = 'library';
  if (/\bexam|\btest\b/.test(s)) o.purpose = 'exam';
  return o;
}

function showResult(r, kindWord) {

    const t = v('m-text').trim();
    if (t.length < 3) { $('#m-res').innerHTML = '<div class="msg bad">Describe the problem in a few words.</div>'; return; }
    addReport(m.id, w, t); closeModal(); renderView(); toast('Report sent. The booking now shows "Under review".');
  }
}

// ---- Shell ----
function renderWho() {
  const opts = U.role === 'student' ? GROUPS.map(g => '<option value="' + g.key + '"' + (g.key === U.groupKey ? ' selected' : '') + '>' + esc(groupLabel(g)) + '</option>').join('')
    : U.role === 'faculty' ? FAC.filter(f => f.id !== 'ADMIN').map(f => '<option value="' + f.id + '"' + (f.id === U.userId ? ' selected' : '') + '>' + esc(f.name) + '</option>').join('') : '<option>Exam Cell (admin)</option>';
  $('#who').innerHTML = '<label class="small" for="role" style="margin:0">Viewing as</label><select id="role" style="width:auto"><option value="faculty"' + (U.role === 'faculty' ? ' selected' : '') + '>Faculty</option><option value="student"' + (U.role === 'student' ? ' selected' : '') + '>Student</option><option value="admin"' + (U.role === 'admin' ? ' selected' : '') + '>Admin</option></select><select id="user" style="width:auto;max-width:200px" aria-label="Person"' + (U.role === 'admin' ? ' disabled' : '') + '>' + opts + '</select>';
}
function renderNav() {
  const tabs = TABS.filter(t => (t !== 'audit' || U.role !== 'student') && (t !== 'admin' || U.role === 'admin'));
  if (!tabs.includes(U.tab)) U.tab = 'rooms';
  const unseen = U.role === 'student' ? S.notices.filter(n => !n.supersededBy && matchAud(n.aud, grp()) && !n.acks.includes(meKey())).length : 0;
  const names = { rooms: 'Find rooms', schedule: 'Schedule', notices: 'Notices' + (unseen ? ' (' + unseen + ' new)' : ''), audit: 'Audit trail', admin: 'Admin' };
  $('#nav').innerHTML = tabs.map(t => '<a href="#' + t + '"' + (t === U.tab ? ' aria-current="page"' : '') + '>' + names[t] + '</a>').join('');
}
function renderView() {
  renderNav();
  $('#view').innerHTML = U.tab === 'rooms' ? viewRooms() : U.tab === 'schedule' ? viewSchedule() : U.tab === 'notices' ? viewNotices() : U.tab === 'audit' ? viewAudit() : viewAdmin();
}
function renderAll() { renderWho(); renderView(); }

function setRole(r) {
  U.role = r; U.mode = r === 'admin' ? 'all' : 'mine';
  if (r === 'faculty' && !FAC.some(f => f.id === U.userId && f.id !== 'ADMIN')) U.userId = 'F7';
  renderAll();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t) { if (e.target.classList && e.target.classList.contains('scrim')) closeModal(); return; }
  const a = t.dataset.action, w = who();
  if (a === 'pick') { U.sel = t.dataset.room; renderView(); }
  else if (a === 'book') openModal({ kind: 'book', room: t.dataset.room });
  else if (a === 'close') closeModal();
  else if (a === 'submit') submitModal();
  else if (a === 'use-room') { $('#m-room').value = t.dataset.room; submitModal(); }
  else if (a === 'use-slot') { $('#m-start').value = t.dataset.start; $('#m-room').value = t.dataset.room; submitModal(); }
  else if (a === 'open-move') openModal({ kind: 'move', id: t.dataset.b });
  else if (a === 'open-cancel') openModal({ kind: 'cancel', id: t.dataset.b });
  else if (a === 'open-report') openModal({ kind: 'report', id: t.dataset.b });
  else if (a === 'approve') { const n = approveBooking(t.dataset.b, w); renderView(); toast('Approved' + (n ? '. Students notified.' : '.')); }
  else if (a === 'resolve') { resolveReport(t.dataset.b, Number(t.dataset.i), w); renderView(); }
  else if (a === 'ack') { ackNotice(t.dataset.n, meKey()); renderAll(); }
  else if (a === 'verify') { U.verify = verifyChain(); renderView(); }
  else if (a === 'nl') {
    const txt = $('#nl').value; U.nl = txt; const p = parseNL(txt);
    if (!Object.keys(p).length) { U.nlMsg = 'Could not find seats, a date or a time in that. Try "60 students Friday 2 pm for 2 hours".'; renderView(); return; }
    Object.assign(U.f, p.need ? { need: p.need } : {}, p.dur ? { dur: p.dur } : {}, p.start ? { start: p.start } : {}, p.date ? { date: p.date } : {}, p.b ? { b: p.b } : {}, p.type ? { type: p.type } : {}, p.purpose ? { purpose: p.purpose } : {});
    if (U.f.start) { const m = toMin(U.f.start); U.f.start = fmt(Math.min(Math.max(Math.round(m / 30) * 30, OPEN), CLOSE - 30)); }
    U.nlMsg = 'Understood: ' + [p.need && p.need + ' seats', p.date && dlabel(p.date), p.start && p.start, p.dur && (p.dur / 60) + ' h', p.b && BUILD[p.b], p.type && TYPENAME[p.type]].filter(Boolean).join(' · ');
    renderView();
  }
  else if (a === 'publish') {
    const title = v('n-title').trim(), body = v('n-body').trim();
    if (!title || !body) { toast('Add a title and details first.'); return; }
    const aud = { branch: v('n-b'), year: Number(v('n-y')), section: v('n-s') };
    const n = announce(v('n-type'), title, body, aud, w.name, '', v('n-rep'));
    renderAll(); toast('Published to ' + audSize(n.aud) + ' students.');
  }
  else if (a === 'toggle-room') { const rm = roomById(t.dataset.room); const list = setRoomOut(rm.id, !rm.out, 'maintenance', w); U.outInfo = rm.out ? { id: rm.id, list } : null; renderView(); }
  else if (a === 'move-to') {
    const r = rescheduleBooking(t.dataset.b, w, { roomId: t.dataset.room });
    if (r.ok) { U.outInfo.list = U.outInfo.list.filter(b => b.id !== t.dataset.b); renderView(); toast('Moved. Students notified.'); } else toast(r.c.errors[0]);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && U.modal) closeModal();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.room')) { e.preventDefault(); U.sel = e.target.dataset.room; renderView(); const g = document.querySelector('.room.selected'); if (g) g.focus(); }
  if (e.key === 'Enter' && e.target.id === 'nl') { e.preventDefault(); document.querySelector('[data-action="nl"]').click(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'role') setRole(t.value);
  else if (t.id === 'user') { if (U.role === 'student') U.groupKey = t.value; else U.userId = t.value; renderView(); }
  else if (t.dataset.f) { U.f[t.dataset.f] = t.dataset.f === 'dur' || t.dataset.f === 'need' ? Number(t.value) : t.value; if (t.dataset.f === 'b') U.f.floor = 'ANY'; renderView(); }
  else if (t.dataset.m === 'mode') { U.mode = t.value; renderView(); }
  else if (t.dataset.m === 'aud' && U.modal && U.modal.kind === 'book') {
    if (t.id === 'm-branch') $('#m-sec').innerHTML = secOpts(t.value, 'All');
    $('#m-need').value = audSize({ branch: v('m-branch'), year: Number(v('m-year')), section: v('m-sec') });
  }
});
function route() { const h = location.hash.slice(1); if (TABS.includes(h)) U.tab = h; renderView(); }
window.addEventListener('hashchange', route);
renderWho(); route();

</script>
